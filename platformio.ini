; ESP32-2432S028 (CYD 2.8" ILI9341 SPI + XPT2046 resistive touch)
; Islamic Prayer Times Dashboard - LVGL 8.x

[env:esp32-2432s028]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800   ; 921600 is unreliable on the CYD's USB-serial chip; use 115200 if this still fails
board_build.partitions = huge_app.csv

lib_deps =
    lovyan03/LovyanGFX@1.1.16   ; pinned: known-good with this config
    lvgl/lvgl@~8.3.11
    bblanchon/ArduinoJson@^7.2.0

build_flags =
    -D LV_CONF_INCLUDE_SIMPLE
    -D LV_LVGL_H_INCLUDE_SIMPLE
    -I include
    -D CORE_DEBUG_LEVEL=1
    ; -D CYD_ST7789            ; uncomment for S028 units with an ST7789 panel (USB-C + micro-USB version)
